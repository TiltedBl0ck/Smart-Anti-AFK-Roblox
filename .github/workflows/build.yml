STREAMING_CHUNK:Configuring workflow triggers...

name: Build and Release Executables

on:
push:
tags:
- "v*.."
workflow_dispatch:

permissions:
contents: write

STREAMING_CHUNK:Defining the Windows build job...

jobs:
build-windows:
runs-on: windows-latest
steps:
- uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'
    
- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install pyinstaller pygetwindow pynput


STREAMING_CHUNK:Compiling and releasing Windows executable...

- name: Build Windows EXE
  run: pyinstaller --noconfirm --onefile --windowed --name "Smart-Anti-AFK-Windows" main.py
  
- name: Upload to Release (Windows)
  uses: softprops/action-gh-release@v2
  if: startsWith(github.ref, 'refs/tags/')
  with:
    files: dist/Smart-Anti-AFK-Windows.exe


STREAMING_CHUNK:Defining the Linux build job...

build-linux:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'
    
- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install pyinstaller evdev


STREAMING_CHUNK:Compiling and releasing Linux executable...

- name: Build Linux Executable
  run: pyinstaller --noconfirm --onefile --windowed --name "Smart-Anti-AFK-Linux" main.py
  
- name: Upload to Release (Linux)
  uses: softprops/action-gh-release@v2
  if: startsWith(github.ref, 'refs/tags/')
  with:
    files: dist/Smart-Anti-AFK-Linux
